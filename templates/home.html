<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGI - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --sigi-blue: #4cb9e4;
            --sigi-blue-light: #3b82f6;
            --sigi-blue-lighter: #60a5fa;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #2893db 0%, #42a6e9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 1.5rem;
        }
        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }
        .brand {
            text-align: center;
            color: #ffffff;
            margin-bottom: 1.5rem;
        }
        .brand .logo {
            width: 72px;
            height: 72px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .brand h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.05em;
        }
        .brand p {
            margin: 0.25rem 0 0;
            font-size: 0.9rem;
            opacity: 0.85;
        }
        .login-card {
            background: #ffffff;
            border-radius: 1rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }
        .login-card h2 {
            text-align: center;
            font-size: 1.35rem;
            font-weight: 600;
            color: #1e293b;
            margin: 0 0 0.5rem;
        }
        .login-card .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.875rem;
            margin: 0 0 2rem;
        }
        .form-label {
            font-weight: 500;
            color: #334155;
            font-size: 0.875rem;
            margin-bottom: 0.4rem;
        }
        .input-group-text {
            background: #f8fafc;
            border-right: none;
            color: #64748b;
        }
        .form-control {
            border-left: none;
            padding: 0.6rem 0.9rem;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: var(--sigi-blue-light);
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.15);
        }
        .input-group:focus-within .input-group-text {
            border-color: var(--sigi-blue-light);
            color: var(--sigi-blue-light);
        }
        .input-group:focus-within .form-control {
            border-color: var(--sigi-blue-light);
        }
        .btn-primary {
            background-color: var(--sigi-blue);
            border-color: var(--sigi-blue);
            padding: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.025em;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background-color: var(--sigi-blue-light);
            border-color: var(--sigi-blue-light);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(30, 58, 138, 0.3);
        }
        .form-check-input:checked {
            background-color: var(--sigi-blue);
            border-color: var(--sigi-blue);
        }
        .form-check-input:focus {
            border-color: var(--sigi-blue-light);
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.15);
        }
        a { color: var(--sigi-blue-light); }
        a:hover { color: var(--sigi-blue); }
        .footer-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.8rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="brand">
            <h1>SIGI</h1>
            <p>Sistema de Gestión de Inventarios</p>
        </div>

        <div class="login-card">
            <h2>Bienvenido a SIGI</h2>
            <p class="subtitle">Ingresa tus datos</p>

            <form>
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="Ingresa tu usuario" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label small" for="remember">Recordarme</label>
                    </div>
                    <a href="#" class="small text-decoration-none">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Iniciar Sesión
                </button>
            </form>
        </div>

        <p class="footer-text">&copy; 2026 SIGI - Todos los derechos reservados</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
