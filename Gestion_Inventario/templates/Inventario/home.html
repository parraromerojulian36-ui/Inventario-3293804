<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventarios - SIGI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <!-- Encabezado Principal SIGI -->
    <header class="bg-primary text-white py-3 mb-4 shadow-sm">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 mb-0 fw-bold">SIGI</h1>
                <small class="text-white-50">Sistema de Gestión de Inventarios - Módulo de Inventario</small>
            </div>
            <span class="badge bg-light text-primary fs-6">Usuario Activo</span>
        </div>
    </header>

    <main class="container-fluid px-4">
        <!-- Barra de Herramientas: Botones de Acción + Filtro -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-center justify-content-between">

                    <!-- Botones de Acción (Izquierda) -->
                    <div class="col-12 col-lg-auto d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-success d-flex align-items-center gap-2">
                            <i class="bi bi-pencil-square"></i> Ingreso Manual
                        </button>
                        <button type="button" class="btn btn-outline-success d-flex align-items-center gap-2">
                            <i class="bi bi-file-earmark-excel"></i> Carga por Excel
                        </button>
                        <button type="button" class="btn btn-outline-dark d-flex align-items-center gap-2">
                            <i class="bi bi-barcode"></i> Carga por Pistola
                        </button>
                    </div>

                    <!-- Panel de Filtro y Búsqueda (Derecha) -->
                    <div class="col-12 col-lg-6">
                        <form class="d-flex gap-2" method="GET">
                            <select class="form-select w-auto" name="criterio_filtro">
                                <option value="todos" selected>Filtrar por...</option>
                                <option value="factura">N° Factura</option>
                                <option value="cliente">Cliente</option>
                                <option value="fecha">Fecha</option>
                            </select>
                            <div class="input-group">
                                <input type="text" class="form-control" name="buscar" placeholder="Buscar venta...">
                                <button class="btn btn-primary" type="submit">
                                    <i class="bi bi-search"></i> Buscar
                                </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>

        <!-- Área de Contenido Principal / Tabla de Registro -->
        <div class="card shadow-sm border-0">
            <div class="card-body text-center py-5 text-muted">
                <i class="bi bi-cart-check display-1"></i>
                <p class="mt-3 fs-5">Módulo listo para registrar transacciones de venta.</p>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
