<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos de la Empresa</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .form-label-custom {
            color: #495057;
            font-weight: 500;
        }
        .help-text {
            font-size: 0.85rem;
            color: #6c757d;
        }
    </style>
</head>
<body class="bg-light py-4">

<div class="container bg-white p-4 rounded shadow-sm" style="max-width: 900px;">
    <h4 class="mb-4 text-secondary border-bottom pb-2">Información de la Empresa</h4>

    <form method="POST">
        {% csrf_token %}

        <!-- Tipo razón social -->
        <div class="row mb-3 align-items-center">
            <label class="col-md-3 form-label-custom">Tipo razón social</label>
            <div class="col-md-9">
                <div class="form-check form-check-inline me-4">
                    <input class="form-check-input" type="radio" name="tipo_razon_social" id="persona" value="persona">
                    <label class="form-check-label" for="persona">Es persona</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tipo_razon_social" id="empresa" value="empresa" checked>
                    <label class="form-check-label" for="empresa">Empresa</label>
                </div>
            </div>
        </div>

        <!-- Razón social -->
        <div class="row mb-3">
            <label for="razon_social" class="col-md-3 form-label-custom col-form-label">Razón social</label>
            <div class="col-md-9">
                <input type="text" class="form-control" id="razon_social" name="razon_social" placeholder="Nombre de la empresa" required>
                <div class="help-text mt-1">Debe coincidir con la registrada en el RUT, para evitar rechazos en documentos electrónicos.</div>
            </div>
        </div>

        <!-- Serial -->
        <div class="row mb-3">
            <label for="serial" class="col-md-3 form-label-custom col-form-label">Serial</label>
            <div class="col-md-9">
                <input type="text" class="form-control" id="serial" name="serial" placeholder="Serial de la empresa" required>
            </div>
        </div>

        <!-- Tipo Identificación -->
        <div class="row mb-3">
            <label for="tipo_identificacion" class="col-md-3 form-label-custom col-form-label">Tipo Identificación</label>
            <div class="col-md-9 d-flex align-items-center">
                <select class="form-select" id="tipo_identificacion" name="tipo_identificacion">
                    <option value="NIT">NIT</option>
                    <option value="CC">Cédula de Ciudadanía</option>
                    <option value="CE">Cédula de Extranjería</option>
                </select>
                <i class="bi bi-info-circle text-secondary ms-2" title="Tipo de documento fiscal"></i>
            </div>
        </div>

        <!-- Identificación y Dígito Verificación -->
        <div class="row mb-3">
            <label for="identificacion" class="col-md-3 form-label-custom col-form-label">Identificación</label>
            <div class="col-md-5 mb-2 mb-md-0">
                <input type="text" class="form-control bg-light" id="identificacion" name="identificacion" placeholder="Número de identificación" required>
            </div>
            <label for="dv" class="col-md-2 form-label-custom col-form-label text-md-end">Dígito Verificación</label>
            <div class="col-md-2 d-flex align-items-center">
                <input type="text" class="form-control bg-light text-center" id="dv" name="dv" placeholder="Dígito" maxlength="1">
                <i class="bi bi-info-circle text-secondary ms-2" title="Dígito de verificación del NIT"></i>
            </div>
        </div>

        <hr class="my-4">

        <!-- Correo Electrónico -->
        <div class="row mb-3">
            <label for="correo" class="col-md-3 form-label-custom col-form-label">Correo Electrónico</label>
            <div class="col-md-9">
                <input type="email" class="form-control" id="correo" name="correo" placeholder="contacto@empresa.com" required>
            </div>
        </div>

        <!-- Dirección -->
        <div class="row mb-3">
            <label for="direccion" class="col-md-3 form-label-custom col-form-label">Dirección</label>
            <div class="col-md-9">
                <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Calle / Carrera # No.">
            </div>
        </div>

        <!-- Contacto (Teléfono) -->
        <div class="row mb-4">
            <label for="contacto" class="col-md-3 form-label-custom col-form-label">Contacto (Teléfono)</label>
            <div class="col-md-9">
                <input type="tel" class="form-control" id="contacto" name="contacto" placeholder="+57 300 000 0000">
            </div>
        </div>

        <!-- Botones Guardar y Volver -->
        <div class="row">
            <div class="col-md-9 offset-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-save me-1"></i> Guardar
                </button>
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-arrow-left me-1"></i> Volver
                </a>
            </div>
        </div>

    </form>
</div>

</body>
</html>
