<title>SIGI - Nueva Sede</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">

<style>
    :root {
        --sigi-blue: #4cb9e4;
        --sigi-blue-light: #3b82f6;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #2893db 0%, #42a6e9 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 1.5rem;
    }

    .sigi-container {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
    }

    .brand {
        text-align: center;
        color: white;
        margin-bottom: 1.5rem;
    }

    .brand h1 {
        font-size: 2rem;
        font-weight: 700;
        margin: 0;
        letter-spacing: 0.05em;
    }

    .brand p {
        margin: 0.25rem 0 0;
        font-size: 0.9rem;
        opacity: 0.85;
    }

    .form-card {
        background: white;
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .form-card h2 {
        color: #1e293b;
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.3rem;
    }

    .subtitle {
        color: #64748b;
        margin-bottom: 1.5rem;
    }

    .form-label {
        color: #334155;
        font-weight: 600;
    }

    .form-control {
        border-radius: 0.6rem;
        padding: 0.7rem;
    }

    .form-control:focus {
        border-color: var(--sigi-blue);
        box-shadow: 0 0 0 0.2rem rgba(76, 185, 228, 0.2);
    }

    .btn-sigi {
        background-color: var(--sigi-blue);
        border-color: var(--sigi-blue);
        color: white;
        font-weight: 600;
    }

    .btn-sigi:hover {
        background-color: var(--sigi-blue-light);
        border-color: var(--sigi-blue-light);
        color: white;
    }

    .btn-secondary {
        font-weight: 600;
    }

    .footer-text {
        text-align: center;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.8rem;
        margin-top: 1.5rem;
    }
</style>
```

</head>

<body>

```
<div class="sigi-container">

    <!-- Encabezado SIGI -->
    <div class="brand">
        <h1>SIGI</h1>
        <p>Sistema de Gestión de Inventarios</p>
    </div>

    <!-- Formulario -->
    <div class="form-card">

        <h2>Nueva Sede</h2>

        <p class="subtitle">
            Registra la información de la nueva sede
        </p>

        <form method="POST">

    {% csrf_token %}

    {% if error %}
        <div class="alert alert-danger">
            <i class="bi bi-exclamation-circle"></i>
            {{ error }}
        </div>
    {% endif %}

            <div class="mb-3">
                <label for="nombreSede" class="form-label">
                    Nombre de la sede
                </label>

                <input type="text"
                       class="form-control"
                       id="nombreSede"
                       name="nombreSede"
                       placeholder="Ejemplo: Sede Principal"
                       required>
            </div>

            <div class="mb-3">
                <label for="municipio" class="form-label">
                    Municipio
                </label>

                <input type="text"
                       class="form-control"
                       id="municipio"
                       name="municipio"
                       placeholder="Ejemplo: Fusagasugá"
                       required>
            </div>

            <div class="mb-3">
                <label for="direccion" class="form-label">
                    Dirección
                </label>

                <input type="text"
                       class="form-control"
                       id="direccion"
                       name="direccion"
                       placeholder="Ejemplo: Calle 10 # 5-20"
                       required>
            </div>

            <div class="mb-4">
                <label for="telefono" class="form-label">
                    Teléfono
                </label>

                <input type="text"
                       class="form-control"
                       id="telefono"
                       name="telefono"
                       placeholder="Ejemplo: 3142297777"
                       required>
            </div>

            <div class="d-flex gap-2">

                <a href="{% url 'Usuarios:lista_sedes' %}"
                   class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i>
                    Cancelar
                </a>

                <button type="submit" class="btn btn-sigi">
                    <i class="bi bi-check-lg"></i>
                    Guardar Sede
                </button>

            </div>

        </form>

    </div>

    <p class="footer-text">
        &copy; 2026 SIGI - Todos los derechos reservados
    </p>

</div>
```

</body>
</html>
