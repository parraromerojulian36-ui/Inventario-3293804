{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Sede - SIGI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0b1f3a, #0a84ff);
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contenedor {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .card-sigi {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .titulo {
            text-align: center;
            color: #0b1f3a;
            margin-bottom: 30px;
        }

        .titulo i {
            color: #0a84ff;
        }

        .form-label {
            font-weight: bold;
            color: #0b1f3a;
        }

        .btn-sigi {
            background: #0a84ff;
            color: white;
            border: none;
        }

        .btn-sigi:hover {
            background: #086dcc;
            color: white;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="card-sigi">

            <h1 class="titulo">
                <i class="bi bi-building"></i>
                Editar Sede
            </h1>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Nombre de la Sede</label>
                    <input
                        type="text"
                        name="nombreSede"
                        class="form-control"
                        value="{{ sede.nombreSede }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Municipio</label>
                    <input
                        type="text"
                        name="municipio"
                        class="form-control"
                        value="{{ sede.municipio }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Dirección</label>
                    <input
                        type="text"
                        name="direccion"
                        class="form-control"
                        value="{{ sede.direccion }}"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Teléfono</label>
                    <input
                        type="text"
                        name="telefono"
                        class="form-control"
                        value="{{ sede.telefono }}"
                        required>
                </div>

                <div class="d-flex gap-2">

                    <a href="{% url 'Usuarios:lista_sedes' %}"
                       class="btn btn-secondary w-50">
                        <i class="bi bi-arrow-left"></i>
                        Cancelar
                    </a>

                    <button type="submit"
                            class="btn btn-sigi w-50">
                        <i class="bi bi-check-lg"></i>
                        Guardar Cambios
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
